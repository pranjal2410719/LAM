name: LAM CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lam_user
          POSTGRES_PASSWORD: lam_password
          POSTGRES_DB: lam_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv venv .venv
          uv pip install -e ".[dev]"

      - name: Quality Gate - Ruff Lint
        run: .venv/bin/ruff check .

      - name: Quality Gate - Ruff Format
        run: .venv/bin/ruff format --check .

      - name: Quality Gate - Mypy Strict
        run: .venv/bin/mypy --strict src/lam tests

      - name: Run Alembic Migrations on PostgreSQL
        env:
          DATABASE_URL: postgresql+asyncpg://lam_user:lam_password@localhost:5432/lam_test_db
        run: .venv/bin/alembic upgrade head

      - name: Quality Gate - Pytest Suite
        env:
          POSTGRES_TEST_URL: postgresql+asyncpg://lam_user:lam_password@localhost:5432/lam_test_db
        run: .venv/bin/pytest -v
